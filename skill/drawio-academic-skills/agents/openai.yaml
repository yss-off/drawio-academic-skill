interface:
  display_name: "Draw.io Academic Figures"
  short_description: "Plan, create, and audit publication-ready draw.io figures with layout candidates, YAML sidecars, manifests, and academic checks"
  brand_color: "#2563EB"

policy:
  allow_implicit_invocation: true

capabilities:
  - Create academic-paper draw.io figures from natural language or YAML specs
  - Compare 2-3 structured layout candidates before complex figure authoring
  - Query a license-tracked local index of bundled examples and templates
  - Build and validate machine-readable figure manifests with semantic, artifact, QA, and provenance evidence
  - Consume sibling base code/config/live imports and multi-page bundles before publication checks
  - Apply publication policy after sibling base postprocess operations without copying their runtime
  - Select raster-publication, vector-submission, or draft-preview and generate the matching primary artifact with editable .drawio
  - Export PNG, SVG, PDF, and JPG through draw.io Desktop when available
  - Produce source-preserving browser-rasterized PNG derivatives when an explicit SVG conversion needs a fidelity fallback
  - Keep live-text SVG preview-only for Word, LibreOffice, Pandoc, and XeLaTeX; require PNG or path-only vector publication assets
  - Verify publication-asset hashes and DOCX/PDF embedding when downstream documents are built
  - Generate diagrams.net browser URLs when Desktop export is unavailable
  - Select from the sibling base palette catalog using venue-aware recommendations
  - Enforce colorblind, grayscale, and publication print-safety palette gates
  - Audit arrow semantics, orthogonal process/progression axes, and closed-loop or fallback routing at intended page scale
  - Enforce role-based ports, unique connector ownership for condition labels, balanced layout grids, and semantic-inventory regression checks
  - Apply user style presets and sibling base bundled presets
  - Self-check exported images and support targeted refinement loops
  - Verify requested SimSun and Times New Roman stacks, disclose installed fallbacks, and recheck page-scale geometry after renderer changes
  - Work without MCP through the sibling base CLI exports and diagrams.net URL fallback

prerequisites:
  - Node 20+
  - Sibling base skill installed at ../drawio
  - Optional draw.io Desktop app for Desktop-backed PNG/PDF/JPG and embedded SVG exports
